[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adhikar"
version = "0.1.0"
description = "OCR + Vision-LLM extraction, arithmetic validation and geospatial discrepancy scoring for Indian land records (Jamabandi / 7-12 Extract)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
adhikar = "adhikar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adhikar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["easyocr.*", "pytesseract.*", "cv2.*", "pypdfium2.*", "shapely.*", "pyproj.*"]
ignore_missing_imports = true
